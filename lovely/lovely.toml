[manifest]
version = "1.0.0"
dump_lua = true
priority = 0

[[patches]]
[patches.pattern]
target = 'engine/sound_manager.lua'
pattern = 'love.audio.play(s.sound)'
match_indent = true
position = 'before'
payload = '''
if string.find(s.sound_code or '', 'bog_') and s.sound and s.sound.seek then
    pcall(function() s.sound:seek(1, "seconds") end)
end
'''

[[patches]]
[patches.pattern]
target = 'engine/sound_manager.lua'
pattern = 's.sound:setVolume(s.current_volume*s.original_volume*(args.sound_settings.volume/100.0)*(args.sound_settings.music_volume/100.0))'
match_indent = true
position = 'at'
payload = '''
local botg_fade = 1
if string.find(s.sound_code or '', 'bog_') and s.sound and s.sound:isPlaying() then
    pcall(function()
        local pos = s.sound:tell("seconds")
        local dur = s.sound:getDuration("seconds")
        if pos and dur and dur > 3 then
            local fi = math.min(1, math.max(0, (pos - 1.0) / 1.5))
            local fo = math.min(1, math.max(0, (dur - pos) / 1.5))
            botg_fade = math.min(fi, fo)
            if dur - pos < 0.08 then
                s.sound:seek(1, "seconds")
            end
        end
    end)
end
s.sound:setVolume(botg_fade*s.current_volume*s.original_volume*(args.sound_settings.volume/100.0)*(args.sound_settings.music_volume/100.0))
'''

[[patches]]
[patches.pattern]
target = 'cardarea.lua'
pattern = 'function CardArea:draw()'
match_indent = true
position = 'after'
payload = '''
if not self.cards then self.cards = {} end
'''

[[patches]]
[patches.pattern]
target = 'cardarea.lua'
pattern = 'for i = 1, #self.cards do'
match_indent = true
position = 'before'
payload = '''
if not self.cards then self.cards = {} end
'''

[[patches]]
[patches.pattern]
target = 'game.lua'
pattern = '''if G.round_eval.alignment.offset.y ~= -7.8 then'''
match_indent = true
position = 'before'
payload = '''
if not G.round_eval then return true end
'''

[[patches]]
[patches.pattern]
target = 'game.lua'
pattern = '''local vouchers_to_spawn = 0'''
match_indent = true
position = 'before'
payload = '''
if G.GAME.current_round and G.GAME.current_round.voucher then
    if type(G.GAME.current_round.voucher) ~= 'table' then
        G.GAME.current_round.voucher = { G.GAME.current_round.voucher, spawn = { [G.GAME.current_round.voucher] = true } }
    elseif not G.GAME.current_round.voucher.spawn then
        G.GAME.current_round.voucher.spawn = {}
        for _, vk in ipairs(G.GAME.current_round.voucher) do G.GAME.current_round.voucher.spawn[vk] = true end
    end
end
'''

# One initialization formula; the native enclosing `if not reset` owns commitment.
[[patches]]
[patches.pattern]
target = 'blind.lua'
pattern = 'self.chips = get_blind_amount(G.GAME.round_resets.ante)*self.mult*G.GAME.starting_params.ante_scaling'
match_indent = true
position = 'at'
payload = """
self.chips = reality_warp_initial_blind_target(self.config.blind, G.GAME.round_resets.ante, false)
if blind then G.GAME.stick_penalty = nil end
"""

[[patches]]
[patches.pattern]
target = 'functions/UI_definitions.lua'
pattern = 'local blind_amt = get_blind_amount(G.GAME.round_resets.blind_ante)*blind_choice.config.mult*G.GAME.starting_params.ante_scaling'
match_indent = true
position = 'at'
payload = """
local blind_amt = reality_warp_preview_blind_target(blind_choice.config, G.GAME.round_resets.blind_ante, type)
"""

# Complete all main/held end-of-round effects before expiring Lucky One's tokens.
[[patches]]
[patches.pattern]
target = 'functions/state_events.lua'
pattern = 'G.FUNCS.draw_from_hand_to_discard()'
match_indent = true
position = 'before'
times = 1
payload = 'reality_warp_reset_lucky_round()'

[[patches]]
[patches.pattern]
target = 'functions/state_events.lua'
pattern = 'G.STATE = G.STATES.GAME_OVER'
match_indent = true
position = 'before'
times = 1
payload = 'reality_warp_reset_lucky_round()'
# End Lucky One round boundaries.
# Divine Ward takes the native fee boundary; match both native and Steamodded's no-UI route.
[[patches]]
[patches.pattern]
target = 'functions/button_callbacks.lua'
pattern = '''if not G.from_boss_tag then ease_dollars(-10) end'''
match_indent = true
position = 'at'
times = 2
payload = '''if not G.from_boss_tag then reality_warp_pay_boss_reroll() end'''


# Ward availability may expose the native button without a voucher or $10; native logic handles paid controls afterward.
[[patches]]
[patches.pattern]
target = 'functions/button_callbacks.lua'
pattern = '''if ((G.GAME.dollars-G.GAME.bankrupt_at) - 10 >= 0) and
      (G.GAME.used_vouchers["v_retcon"] or
      (G.GAME.used_vouchers["v_directors_cut"] and not G.GAME.round_resets.boss_rerolled)) then'''
match_indent = true
position = 'at'
times = 1
payload = '''if reality_warp_divine_ward_free_available() or (((G.GAME.dollars-G.GAME.bankrupt_at) - 10 >= 0) and
      (G.GAME.used_vouchers["v_retcon"] or
      (G.GAME.used_vouchers["v_directors_cut"] and not G.GAME.round_resets.boss_rerolled))) then'''

# Create the button for a free Ward use and bind its private price label to native UIElement:update_text.
[[patches]]
[patches.pattern]
target = 'functions/UI_definitions.lua'
pattern = '''(G.GAME.used_vouchers["v_retcon"] or G.GAME.used_vouchers["v_directors_cut"]) and
        UIBox_button({label = {localize('b_reroll_boss'), localize('$')..'10'}, button = "reroll_boss", func = 'reroll_boss_button'}) or nil'''
match_indent = true
position = 'at'
times = 1
payload = '''reality_warp_boss_reroll_button_visible() and reality_warp_divine_ward_reroll_button() or nil'''
# Apply owned physical-card draw rules after Steamodded's slot-cost/Serpent selection.
[[patches]]
[patches.pattern]
target = 'functions/state_events.lua'
pattern = 'SMODS.cards_to_draw = (SMODS.cards_to_draw or 0) + hand_space'
position = 'before'
match_indent = true
payload = '''
if reality_warp_prepare_action_draw then
    cards_to_draw, hand_space = reality_warp_prepare_action_draw(cards_to_draw, hand_space)
end
'''

# Guard CardArea:draw against nil self.cards
[[patches]]
[patches.pattern]
target = 'cardarea.lua'
pattern = 'function CardArea:draw()'
position = 'after'
match_indent = true
payload = '''
    if not self.cards then return end
'''
